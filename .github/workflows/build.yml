name: Build README
on:
  schedule: [{cron: "0 */6 * * *"}]
  push: {paths: [projects.json, build.py]}
  workflow_dispatch:
permissions: {contents: write}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python build.py
        env: {GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"}
      - run: |
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git add README.md; git diff --staged --quiet || (git commit -m "chore: rebuild README" && git push)
